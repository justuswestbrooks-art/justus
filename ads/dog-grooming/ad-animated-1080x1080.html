<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scruffy to Fluffy Animated Ad</title>
<style>
  /* Brand colors pulled from the Scruffy to Fluffy logo. 8s seamless loop. */
  :root {
    --navy: #1B2556;
    --teal: #1A9AA6;
    --teal-dark: #127A85;
    --sun: #FFD23F;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: var(--teal); font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 50% 48%, #23B3BF 0 30%, var(--teal) 55%, var(--teal-dark) 100%); }

  /* whole scene fades out at the very end so the loop restarts cleanly */
  .stage { position: absolute; inset: 0; animation: loopFade 8s linear infinite; }
  @keyframes loopFade { 0%, 94% { opacity: 1; } 100% { opacity: 0; } }

  /* drifting paw prints + rising bubbles */
  .paw { position: absolute; width: 90px; height: 90px; opacity: .16; animation: drift 4s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-18px) rotate(calc(var(--r) + 12deg)); } }
  .bubble { position: absolute; bottom: -80px; border-radius: 50%; border: 4px solid rgba(255,255,255,.7);
            background: rgba(255,255,255,.18); animation: rise 4s ease-in infinite; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; }
                    100% { transform: translateY(-1250px) scale(1.1); opacity: 0; } }

  /* headline drops in, "scruffy?" wiggles */
  h1 { position: absolute; top: 44px; left: 0; right: 0; text-align: center;
       color: var(--white); font-size: 64px; font-weight: 800; letter-spacing: -1px;
       text-shadow: 0 4px 0 rgba(0,0,0,.15); animation: dropIn .8s .1s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes dropIn { 0% { transform: translateY(-170px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  h1 .wig { display: inline-block; color: var(--navy); animation: wiggle 1s 1s ease-in-out infinite; }
  @keyframes wiggle { 0%, 50%, 100% { transform: rotate(0); } 12% { transform: rotate(-7deg) scale(1.06); }
                      25% { transform: rotate(6deg) scale(1.06); } 37% { transform: rotate(-3deg); } }

  /* logo pops in, then gently bobs */
  .bob { position: absolute; left: 190px; top: 142px; width: 700px; height: 700px; animation: bob 2s 1.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .card { width: 700px; height: 700px; border-radius: 50%; background: var(--white);
          border: 12px solid var(--navy); box-shadow: 0 18px 0 rgba(0,0,0,.12);
          display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
          animation: popIn 1s .45s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .card img { width: 600px; height: auto; filter: brightness(1.05) contrast(1.03); }
  .shine { position: absolute; inset: 0; pointer-events: none;
           background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%);
           animation: sweep 4s 1.6s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-120%); } 30%, 100% { transform: translateX(120%); } }

  /* sparkles twinkle around the logo */
  .spark { position: absolute; width: 56px; height: 56px; animation: twinkle 2s ease-in-out infinite both; }
  @keyframes twinkle { 0%, 100% { transform: scale(0) rotate(0); opacity: 0; } 40% { transform: scale(1.15) rotate(90deg); opacity: 1; }
                       70% { transform: scale(.4) rotate(160deg); opacity: .6; } }

  /* "Now Booking" starburst badge */
  .badge { position: absolute; left: 800px; top: 150px; width: 190px; height: 190px;
           animation: badgeIn .7s 2.4s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes badgeIn { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(12deg); } }
  .badge svg { position: absolute; inset: 0; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
                color: var(--navy); font-weight: 900; font-size: 23px; line-height: 1.05; }

  /* CTA slides up, then pulses with a shine */
  .bottom { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center;
            animation: slideUp .7s 1.8s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes slideUp { 0% { transform: translateY(220px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .cta { position: relative; overflow: hidden; display: inline-block; background: var(--navy); color: var(--white);
         font-size: 50px; font-weight: 800; padding: 22px 56px; border-radius: 999px;
         box-shadow: 0 8px 0 #0E1433; animation: pulse 1s 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .cta small { display: block; font-size: 26px; font-weight: 700; color: #9FE3E9; letter-spacing: 3px; margin-bottom: 2px; }
  .cta::after { content: ""; position: absolute; inset: 0;
                background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
                animation: sweep 2s 2.5s ease-in-out infinite; transform: translateX(-120%); }
</style>
</head>
<body>
<div class="ad">
  <svg width="0" height="0" style="position:absolute">
    <symbol id="paw" viewBox="0 0 100 100">
      <ellipse cx="50" cy="68" rx="24" ry="20" fill="#fff"/>
      <ellipse cx="22" cy="42" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="40" cy="24" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="60" cy="24" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="78" cy="42" rx="10" ry="13" fill="#fff"/>
    </symbol>
    <symbol id="star" viewBox="0 0 100 100">
      <path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" fill="#fff"/>
    </symbol>
  </svg>

  <!-- background life (outside .stage so it never fades) -->
  <svg class="paw" style="--r:-20deg;left:40px;top:200px"><use href="#paw"/></svg>
  <svg class="paw" style="--r:15deg;left:110px;top:520px;animation-delay:-1s"><use href="#paw"/></svg>
  <svg class="paw" style="--r:-10deg;left:30px;top:820px;animation-delay:-2s"><use href="#paw"/></svg>
  <svg class="paw" style="--r:20deg;right:40px;top:380px;animation-delay:-3s"><use href="#paw"/></svg>
  <svg class="paw" style="--r:-15deg;right:100px;top:600px;animation-delay:-1.5s"><use href="#paw"/></svg>
  <svg class="paw" style="--r:10deg;right:30px;top:840px;animation-delay:-2.5s"><use href="#paw"/></svg>

  <div class="bubble" style="left:70px;width:50px;height:50px"></div>
  <div class="bubble" style="left:170px;width:30px;height:30px;animation-delay:-1.2s"></div>
  <div class="bubble" style="left:900px;width:60px;height:60px;animation-delay:-2.2s"></div>
  <div class="bubble" style="left:990px;width:34px;height:34px;animation-delay:-3.1s"></div>
  <div class="bubble" style="left:260px;width:24px;height:24px;animation-delay:-2.7s"></div>
  <div class="bubble" style="left:820px;width:28px;height:28px;animation-delay:-0.6s"></div>

  <div class="stage">
    <h1>Pup looking <span class="wig">scruffy?</span> 🐾</h1>

    <div class="bob">
      <div class="card">
        <img src="logo.png" alt="Scruffy to Fluffy Pet Grooming — Serving Callahan, Florida — (904) 402-9536">
        <div class="shine"></div>
      </div>
    </div>

    <svg class="spark" style="left:170px;top:190px;animation-delay:1.3s"><use href="#star"/></svg>
    <svg class="spark" style="left:120px;top:560px;animation-delay:1.8s"><use href="#star"/></svg>
    <svg class="spark" style="left:880px;top:520px;animation-delay:1.5s"><use href="#star"/></svg>
    <svg class="spark" style="left:860px;top:780px;animation-delay:2.1s"><use href="#star"/></svg>
    <svg class="spark" style="left:200px;top:800px;animation-delay:2.4s;width:40px;height:40px"><use href="#star"/></svg>

    <div class="badge">
      <svg viewBox="0 0 100 100"><polygon fill="#FFD23F" stroke="#1B2556" stroke-width="3" points="50.0,2.0 57.4,12.7 68.4,5.7 71.1,18.4 83.9,16.1 81.6,28.9 94.3,31.6 87.3,42.6 98.0,50.0 87.3,57.4 94.3,68.4 81.6,71.1 83.9,83.9 71.1,81.6 68.4,94.3 57.4,87.3 50.0,98.0 42.6,87.3 31.6,94.3 28.9,81.6 16.1,83.9 18.4,71.1 5.7,68.4 12.7,57.4 2.0,50.0 12.7,42.6 5.7,31.6 18.4,28.9 16.1,16.1 28.9,18.4 31.6,5.7 42.6,12.7"/></svg>
      <span>NOW<br>BOOKING!</span>
    </div>

    <div class="bottom">
      <div class="cta"><small>CALL TO BOOK TODAY</small>(904) 402-9536</div>
    </div>
  </div>
</div>
</body>
</html>
