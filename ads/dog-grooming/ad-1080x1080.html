<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scruffy to Fluffy Ad</title>
<style>
  /* Brand colors pulled from the Scruffy to Fluffy logo */
  :root {
    --navy: #1B2556;
    --teal: #1A9AA6;
    --teal-dark: #127A85;
    --cream: #FFF8EE;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: var(--teal); font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; }
  .ad { position: relative; width: 1080px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 50% 48%, #23B3BF 0 30%, var(--teal) 55%, var(--teal-dark) 100%); }

  /* scattered paw prints */
  .paw { position: absolute; width: 90px; opacity: .16; }

  h1 { position: absolute; top: 44px; left: 0; right: 0; text-align: center;
       color: var(--white); font-size: 64px; font-weight: 800; letter-spacing: -1px;
       text-shadow: 0 4px 0 rgba(0,0,0,.15); }
  h1 span { color: var(--navy); }

  .card { position: absolute; left: 50%; top: 142px; transform: translateX(-50%);
          width: 700px; height: 700px; border-radius: 50%; background: var(--white);
          border: 12px solid var(--navy); box-shadow: 0 18px 0 rgba(0,0,0,.12);
          display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card img { width: 600px; height: auto; filter: brightness(1.05) contrast(1.03); }

  .bottom { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; }
  .cta { display: inline-block; background: var(--navy); color: var(--white);
         font-size: 50px; font-weight: 800; padding: 22px 56px; border-radius: 999px;
         box-shadow: 0 8px 0 #0E1433; }
  .cta small { display: block; font-size: 26px; font-weight: 700; color: #9FE3E9; letter-spacing: 3px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="ad">
  <svg width="0" height="0" style="position:absolute">
    <symbol id="paw" viewBox="0 0 100 100">
      <ellipse cx="50" cy="68" rx="24" ry="20" fill="#fff"/>
      <ellipse cx="22" cy="42" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="40" cy="24" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="60" cy="24" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="78" cy="42" rx="10" ry="13" fill="#fff"/>
    </symbol>
  </svg>
  <svg class="paw" style="left:40px;top:200px;transform:rotate(-20deg)"><use href="#paw"/></svg>
  <svg class="paw" style="left:110px;top:520px;transform:rotate(15deg)"><use href="#paw"/></svg>
  <svg class="paw" style="left:30px;top:820px;transform:rotate(-10deg)"><use href="#paw"/></svg>
  <svg class="paw" style="right:40px;top:240px;transform:rotate(20deg)"><use href="#paw"/></svg>
  <svg class="paw" style="right:100px;top:560px;transform:rotate(-15deg)"><use href="#paw"/></svg>
  <svg class="paw" style="right:30px;top:840px;transform:rotate(10deg)"><use href="#paw"/></svg>

  <h1>Pup looking <span>scruffy?</span> 🐾</h1>

  <div class="card">
    <img src="logo.png" alt="Scruffy to Fluffy Pet Grooming — Serving Callahan, Florida — (904) 402-9536">
  </div>

  <div class="bottom">
    <div class="cta"><small>CALL TO BOOK TODAY</small>(904) 402-9536</div>
  </div>
</div>
</body>
</html>
