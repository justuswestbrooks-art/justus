<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scruffy to Fluffy Facebook Cover</title>
<style>
  /* 1500x1000 (3:2) so the Facebook phone app shows the whole cover.
     The profile picture covers the bottom-centre (x 430-1070, y 490+), and the
     bottom ~9% at the sides is hidden, so content sits in the top band and
     the two lower corners. */
  :root { --navy: #1B2556; --teal: #1A9AA6; --teal-dark: #127A85; --sun: #FFD23F; --white: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1500px; height: 1000px; overflow: hidden; font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; }
  .cover { position: relative; width: 1500px; height: 1000px; overflow: hidden;
           background: radial-gradient(circle at 50% 40%, #23B3BF 0 25%, var(--teal) 55%, var(--teal-dark) 100%); }
  .paw { position: absolute; width: 90px; height: 90px; opacity: .15; }
  .bubble { position: absolute; border-radius: 50%; border: 4px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); }

  .top { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
  .pill { display: inline-block; background: var(--navy); color: var(--white); font-weight: 800; font-size: 30px;
          letter-spacing: 3px; padding: 14px 34px; border-radius: 999px; }
  h1 { color: var(--white); font-size: 116px; line-height: 1; font-weight: 900; letter-spacing: -2px; margin-top: 30px;
       text-shadow: 0 6px 0 rgba(0,0,0,.15); }
  h1 span { color: var(--navy); text-shadow: none; }
  .sub { color: var(--white); font-size: 46px; font-weight: 700; margin-top: 26px; }
  .sub b { color: var(--sun); }

  .right { position: absolute; right: 50px; top: 460px; text-align: right; }
  .phone { display: inline-block; background: var(--white); color: var(--navy); font-size: 42px; font-weight: 900;
           padding: 16px 32px; border-radius: 999px; box-shadow: 0 7px 0 rgba(0,0,0,.18); white-space: nowrap; }
  .tags { color: var(--white); font-size: 36px; font-weight: 800; line-height: 1.35; margin-top: 30px; }

  .seal { position: absolute; left: 50px; top: 420px; width: 380px; height: 380px; transform: rotate(-8deg); }
  .seal svg { position: absolute; inset: 0; filter: drop-shadow(0 12px 0 rgba(0,0,0,.15)); }
  .seal .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              color: var(--navy); text-align: center; padding-bottom: 16px; }
  .seal .num { font-size: 146px; font-weight: 900; line-height: .85; letter-spacing: -5px; }
  .seal .yrs { font-size: 38px; font-weight: 900; letter-spacing: 4px; }
  .seal .of { font-size: 19px; font-weight: 800; margin-top: 2px; }
</style>
</head>
<body>
<div class="cover">
  <svg width="0" height="0" style="position:absolute">
    <symbol id="paw" viewBox="0 0 100 100">
      <ellipse cx="50" cy="68" rx="24" ry="20" fill="#fff"/>
      <ellipse cx="22" cy="42" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="40" cy="24" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="60" cy="24" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="78" cy="42" rx="10" ry="13" fill="#fff"/>
    </symbol>
  </svg>
  <svg class="paw" style="left:40px;top:50px;transform:rotate(-20deg)"><use href="#paw"/></svg>
  <svg class="paw" style="left:1370px;top:60px;transform:rotate(20deg)"><use href="#paw"/></svg>
  <svg class="paw" style="left:560px;top:430px;transform:rotate(-12deg)"><use href="#paw"/></svg>
  <svg class="paw" style="left:860px;top:420px;transform:rotate(15deg)"><use href="#paw"/></svg>
  <svg class="paw" style="left:1200px;top:760px;transform:rotate(-10deg)"><use href="#paw"/></svg>
  <div class="bubble" style="left:470px;top:380px;width:40px;height:40px"></div>
  <div class="bubble" style="left:1010px;top:390px;width:30px;height:30px"></div>
  <div class="bubble" style="left:140px;top:300px;width:50px;height:50px"></div>
  <div class="bubble" style="left:1330px;top:300px;width:56px;height:56px"></div>

  <div class="top">
    <div class="pill">SCRUFFY TO FLUFFY PET GROOMING</div>
    <h1>From Scruffy to <span>Fluffy!</span> 🐾</h1>
    <p class="sub">Groomed with love by <b>Traci Westbrooks</b></p>
  </div>

  <div class="seal">
    <svg viewBox="0 0 100 100"><polygon fill="#FFD23F" stroke="#1B2556" stroke-width="2.5" points="50.0,2.0 56.4,9.5 64.8,4.3 68.6,13.5 78.2,11.2 79.0,21.0 88.8,21.8 86.5,31.4 95.7,35.2 90.5,43.6 98.0,50.0 90.5,56.4 95.7,64.8 86.5,68.6 88.8,78.2 79.0,79.0 78.2,88.8 68.6,86.5 64.8,95.7 56.4,90.5 50.0,98.0 43.6,90.5 35.2,95.7 31.4,86.5 21.8,88.8 21.0,79.0 11.2,78.2 13.5,68.6 4.3,64.8 9.5,56.4 2.0,50.0 9.5,43.6 4.3,35.2 13.5,31.4 11.2,21.8 21.0,21.0 21.8,11.2 31.4,13.5 35.2,4.3 43.6,9.5"/>
      <circle cx="50" cy="50" r="39" fill="none" stroke="#1B2556" stroke-width="1.2" stroke-dasharray="2 2"/></svg>
    <div class="in">
      <div class="num">40</div>
      <div class="yrs">YEARS</div>
      <div class="of">of happy pups</div>
    </div>
  </div>

  <div class="right">
    <div class="phone">📞 (904) 402-9536</div>
    <div class="tags">All Breeds • All Sizes<br>Callahan, Florida</div>
  </div>
</div>
</body>
</html>
